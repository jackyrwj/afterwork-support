<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 680px; margin: 0 auto; padding: 24px 16px; line-height: 1.7; color: #1d1d1f; background: #fff; }
  h1 { font-size: 1.5em; margin-bottom: 0.2em; }
  h2 { font-size: 1.15em; margin-top: 1.8em; color: #333; }
  p, li { margin: 0.6em 0; }
  ul { padding-left: 1.2em; }
  a { color: #0071e3; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f5f5f7; } h2 { color: #ccc; } a { color: #64a8ff; } }

<h1>下班专注 支持</h1>

<p>如果你在使用下班专注时遇到问题，或有功能建议，请通过电子邮件联系开发者。</p>
<p>支持邮箱：<a href="mailto:raowenjieszu@gmail.com">raowenjieszu@gmail.com</a></p>

<h2>常见问题</h2>
<ul>
  <li><strong>通知没有出现</strong>：请在「设置 → 通知 → 下班专注」中允许通知。</li>
  <li><strong>如何修改时间</strong>：打开「我的 → 时间设置」。</li>
  <li><strong>如何修改任务</strong>：打开「计划」，选择任务后编辑名称、图标、颜色和每周安排。</li>
  <li><strong>如何删除本地数据</strong>：卸载应用即可删除应用保存在设备上的数据。</li>
</ul>
</body>
